<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover, shrink-to-fit=yes">
  <title>RIKI • Official Contact</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #030303;
      font-family: 'Inter', 'Segoe UI', 'Prompt', system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.25rem;
      position: relative;
      overflow-x: hidden;
      -webkit-tap-highlight-color: transparent;
    }

    .bg-layer {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
    }

    .particle {
      position: absolute;
      background: rgba(180, 130, 255, 0.25);
      border-radius: 50%;
      filter: blur(2px);
      box-shadow: 0 0 20px #b084ff, 0 0 8px #7b4aff;
      animation: floatParticle 18s infinite alternate ease-in-out;
    }

    .streak {
      position: absolute;
      width: 1px;
      height: 80px;
      background: linear-gradient(to bottom, transparent, rgba(0, 255, 255, 0.3), transparent);
      box-shadow: 0 0 15px cyan;
      opacity: 0.2;
      animation: streakMove 12s infinite linear;
    }

    @keyframes floatParticle {
      0% { transform: translate(0, 0) scale(0.8); opacity: 0.3; }
      100% { transform: translate(30px, -50px) scale(1.8); opacity: 0.7; }
    }

    @keyframes streakMove {
      0% { transform: translateY(0) translateX(0); opacity: 0.1; }
      50% { transform: translateY(-120px) translateX(20px); opacity: 0.35; }
      100% { transform: translateY(10px) translateX(-15px); opacity: 0.1; }
    }

    .container {
      position: relative;
      z-index: 10;
      width: 100%;
      max-width: 420px;
      margin: 0 auto;
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      background: rgba(8, 8, 12, 0.45);
      border-radius: 3rem 3rem 2.5rem 2.5rem;
      padding: 2.25rem 1.5rem 2rem;
      box-shadow: 0 30px 50px rgba(0, 0, 0, 0.8), inset 0 0 40px rgba(120, 80, 255, 0.15);
      border: 1px solid rgba(255, 255, 255, 0.07);
      animation: fadeInUp 0.9s cubic-bezier(0.16, 1, 0.3, 1);
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    @keyframes fadeInUp {
      0% { opacity: 0; transform: translateY(35px); }
      100% { opacity: 1; transform: translateY(0); }
    }

    .profile-wrapper {
      position: relative;
      margin-top: 0.2rem;
      margin-bottom: 1.3rem;
      display: flex;
      justify-content: center;
      align-items: center;
      animation: softFloat 4.5s infinite alternate ease-in-out;
    }

    @keyframes softFloat {
      0% { transform: translateY(0); }
      100% { transform: translateY(-7px); }
    }

    .glow-backdrop {
      position: absolute;
      width: 120px;
      height: 120px;
      background: radial-gradient(circle, rgba(180, 100, 255, 0.5) 0%, rgba(0, 255, 255, 0.15) 70%, transparent 90%);
      border-radius: 50%;
      filter: blur(28px);
      z-index: 0;
      animation: pulseGlow 3s infinite alternate;
    }

    @keyframes pulseGlow {
      0% { transform: scale(0.9); opacity: 0.7; }
      100% { transform: scale(1.15); opacity: 0.95; }
    }

    .profile-ring {
      position: absolute;
      width: 108px;
      height: 108px;
      border-radius: 50%;
      background: conic-gradient(from 180deg, #ff66c4, #7b4aff, #00e5ff, #b084ff, #ff66c4);
      filter: blur(7px);
      opacity: 0.6;
      animation: rotateRing 8s infinite linear;
      z-index: 1;
    }

    @keyframes rotateRing {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .profile-pic {
      width: 92px;
      height: 92px;
      border-radius: 50%;
      object-fit: cover;
      background: #0a0a0f;
      border: 2px solid rgba(255, 255, 255, 0.25);
      box-shadow: 0 0 35px #b54bff, 0 0 15px #00ffff;
      z-index: 2;
      position: relative;
      transition: transform 0.2s ease;
      object-position: center;
    }

    .floating-dot {
      position: absolute;
      width: 4px;
      height: 4px;
      background: white;
      border-radius: 50%;
      box-shadow: 0 0 18px #ffb3ff, 0 0 8px #af6eff;
      z-index: 3;
      animation: orbit 7s infinite linear;
    }

    @keyframes orbit {
      0% { transform: rotate(0deg) translateX(55px) scale(0.6); opacity: 0.6; }
      50% { transform: rotate(180deg) translateX(55px) scale(1.4); opacity: 1; }
      100% { transform: rotate(360deg) translateX(55px) scale(0.6); opacity: 0.6; }
    }

    .name {
      font-size: 2.5rem;
      font-weight: 700;
      letter-spacing: 2px;
      background: linear-gradient(to right, #ffffff, #d9b3ff, #a0f0ff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      filter: drop-shadow(0 0 18px #9d4eff);
      margin-bottom: 0.2rem;
      line-height: 1.2;
    }

    .subtitle {
      font-size: 0.9rem;
      font-weight: 400;
      color: rgba(220, 210, 255, 0.8);
      letter-spacing: 1.5px;
      text-transform: uppercase;
      margin-bottom: 0.1rem;
    }

    .thai-tagline {
      font-size: 0.95rem;
      color: #cfc0ff;
      opacity: 0.8;
      margin-bottom: 2rem;
      font-weight: 300;
      letter-spacing: 0.5px;
    }

    .buttons {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 1rem;
      margin-bottom: 2rem;
    }

    .social-btn {
      display: flex;
      align-items: center;
      justify-content: flex-start;
      gap: 1rem;
      background: rgba(15, 15, 20, 0.55);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 3rem;
      padding: 0.9rem 1.8rem;
      text-decoration: none;
      color: #f0f0ff;
      font-weight: 500;
      font-size: 1.2rem;
      letter-spacing: 0.3px;
      box-shadow: 0 8px 18px rgba(0, 0, 0, 0.5), 0 0 12px rgba(130, 80, 255, 0.3);
      transition: all 0.25s ease;
      position: relative;
      overflow: hidden;
      animation: buttonAppear 0.7s ease backwards;
    }

    .social-btn i {
      font-size: 1.6rem;
      width: 2rem;
      text-align: center;
      filter: drop-shadow(0 0 8px currentColor);
    }

    .social-btn span {
      flex: 1;
      text-align: left;
      font-weight: 500;
    }

    .social-btn.line { border-left: 3px solid #06C755; box-shadow: 0 0 15px #06C75540; }
    .social-btn.facebook { border-left: 3px solid #1877F2; box-shadow: 0 0 15px #1877F240; }
    .social-btn.instagram { border-left: 3px solid #E1306C; box-shadow: 0 0 15px #E1306C40; }
    .social-btn.discord { border-left: 3px solid #5865F2; box-shadow: 0 0 15px #5865F240; }
    .social-btn.tiktok { border-left: 3px solid #ff0050; box-shadow: 0 0 15px #ff005040; }

    .social-btn:hover {
      transform: translateY(-3px) scale(1.02);
      background: rgba(30, 25, 45, 0.7);
      border-color: rgba(255, 255, 255, 0.35);
      box-shadow: 0 15px 28px rgba(0, 0, 0, 0.7), 0 0 30px currentColor;
    }

    .social-btn:active {
      transform: scale(0.96);
      transition: 0.08s;
      background: rgba(40, 30, 60, 0.8);
    }

    @keyframes buttonAppear {
      0% { opacity: 0; transform: translateY(25px); }
      100% { opacity: 1; transform: translateY(0); }
    }

    .btn1 { animation-delay: 0.1s; }
    .btn2 { animation-delay: 0.2s; }
    .btn3 { animation-delay: 0.3s; }
    .btn4 { animation-delay: 0.4s; }
    .btn5 { animation-delay: 0.5s; }

    .footer {
      font-size: 0.75rem;
      color: #6b6b7a;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      padding-top: 1.3rem;
      width: 100%;
      letter-spacing: 0.4px;
      opacity: 0.8;
    }

    @media (max-width: 380px) {
      .container {
        padding: 1.8rem 1.2rem 1.5rem;
      }
      .social-btn {
        padding: 0.8rem 1.4rem;
        font-size: 1rem;
      }
    }
  </style>
</head>
<body>
  <div class="bg-layer" id="bgLayer"></div>

  <div class="container">
    <div class="profile-wrapper">
      <div class="glow-backdrop"></div>
      <div class="profile-ring"></div>
      <img 
        src="https://img2.pic.in.th/IMG_2368cb22703827038471.jpeg" 
        alt="RIKI anime profile" 
        class="profile-pic"
        loading="eager"
      >
      <div class="floating-dot" style="top: 5px; left: -8px; animation-duration: 6s;"></div>
      <div class="floating-dot" style="bottom: 2px; right: -4px; animation-duration: 7.5s; animation-delay: -2s;"></div>
    </div>

    <h1 class="name">RIKI</h1>
    <div class="subtitle">Official Contact</div>
    <div class="thai-tagline">“ช่องทางติดต่อทั้งหมดของผม”</div>

    <div class="buttons">
      <!-- LINE -->
      <a href="https://line.me/ti/p/vGhxEkP2sC" class="social-btn line btn1" target="_blank" rel="noopener">
        <i class="fab fa-line" style="color: #06C755;"></i>
        <span>LINE</span>
      </a>
      <!-- Facebook -->
      <a href="https://www.facebook.com/share/1D52a4hWax/?mibextid=wwXIfr" class="social-btn facebook btn2" target="_blank" rel="noopener">
        <i class="fab fa-facebook" style="color: #1877F2;"></i>
        <span>Facebook</span>
      </a>
      <!-- Instagram -->
      <a href="https://www.instagram.com/riki_marru06?igsh=ZmV2MXBxYjc1b2ox&utm_source=qr" class="social-btn instagram btn3" target="_blank" rel="noopener">
        <i class="fab fa-instagram" style="color: #E1306C;"></i>
        <span>Instagram</span>
      </a>
      <!-- Discord (ยังไม่มีลิงก์จริง ใส่ # ไว้ก่อน) -->
      <a href="#" class="social-btn discord btn4" target="_blank" rel="noopener">
        <i class="fab fa-discord" style="color: #5865F2;"></i>
        <span>Discord กลุ่ม</span>
      </a>
      <!-- TikTok (ยังไม่มีลิงก์จริง ใส่ # ไว้ก่อน) -->
      <a href="#" class="social-btn tiktok btn5" target="_blank" rel="noopener">
        <i class="fab fa-tiktok" style="color: #ff0050;"></i>
        <span>TikTok</span>
      </a>
    </div>

    <div class="footer">
      © 2026 RIKI STORE <br> All rights reserved.
    </div>
  </div>

  <script>
    (function() {
      const bgLayer = document.getElementById('bgLayer');
      if (!bgLayer) return;

      for (let i = 0; i < 18; i++) {
        const particle = document.createElement('div');
        particle.className = 'particle';
        const size = Math.floor(Math.random() * 5 + 2) + 'px';
        particle.style.width = size;
        particle.style.height = size;
        particle.style.left = Math.random() * 100 + '%';
        particle.style.top = Math.random() * 100 + '%';
        particle.style.animationDelay = Math.random() * 10 + 's';
        particle.style.animationDuration = 14 + Math.random() * 14 + 's';
        bgLayer.appendChild(particle);
      }

      for (let j = 0; j < 8; j++) {
        const streak = document.createElement('div');
        streak.className = 'streak';
        streak.style.left = Math.random() * 90 + '%';
        streak.style.top = Math.random() * 70 + '%';
        streak.style.animationDelay = Math.random() * 8 + 's';
        streak.style.height = (60 + Math.random() * 70) + 'px';
        bgLayer.appendChild(streak);
      }
    })();
  </script>
</body>
</html>
